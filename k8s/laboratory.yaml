apiVersion: apps/v1
kind: Deployment
metadata: {name: laboratory-service, namespace: hms}
spec:
  replicas: 2
  selector: {matchLabels: {app: laboratory-service}}
  template:
    metadata: {labels: {app: laboratory-service}}
    spec:
      serviceAccountName: hms-sa
      containers:
        - name: app
          image: 952652904096.dkr.ecr.us-east-1.amazonaws.com/hospital-management-laboratory:d695424fdc45295d8c2c794cb56f98b77b83cf5e
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: hms-config}
            - secretRef: {name: hms-secrets}
            - secretRef: {name: laboratorydb-conn}   # RDS endpoints + credentials, created by the deploy job
          readinessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 5}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: laboratory-service, namespace: hms}
spec:
  selector: {app: laboratory-service}
  ports: [{port: 80, targetPort: 8000}]